using System;
using System.Collections.Generic;
using System.Drawing;
using System.Windows.Forms;

namespace Snake
{
    public class GameForm : Form
    {
        private List<Point> snake;
        private Point food;

        private int directionX;
        private int directionY;

        private int score = 0;

        private const int cellSize = 25;
        private const int gridSize = 40;

        private Timer gameTimer;
        private Random rnd = new Random();

        public GameForm()
        {
            this.Text = "Здесь могла быть ваша реклама";
            this.ClientSize = new Size(cellSize * gridSize, cellSize * gridSize);
            this.DoubleBuffered = true;
            this.KeyPreview = true;
            this.KeyDown += OnKeyDown;

            InitGame();

            gameTimer = new Timer();
            gameTimer.Interval = 150;
            gameTimer.Tick += Update;
            gameTimer.Start();
        }

        private void InitGame()
        {
            snake = new List<Point>();
            snake.Add(new Point(gridSize / 2, gridSize / 2));
            GenerateFood();
            score = 0;

            directionX = 1;
            directionY = 0;
        }

        private void GenerateFood()
        {
            food = new Point(rnd.Next(0, gridSize), rnd.Next(0, gridSize));
        }

        private void Update(object sender, EventArgs e)
        {
            Point head = snake[0];
            Point newHead = new Point(head.X + directionX, head.Y + directionY);

            if (newHead.X < 0 || newHead.X >= gridSize || newHead.Y < 0 || newHead.Y >= gridSize)
            {
                GameOver("Вы покинули пределы поля!");
                return;
            }

            for (int i = 0; i < snake.Count; i++)
            {
                if (snake[i] == newHead)
                {
                    GameOver("Вы врезались в свой хвост");
                    return;
                }
            }

            snake.Insert(0, newHead);

            if (newHead == food)
            {
                score++;
                GenerateFood();
            }
            else
            {
                snake.RemoveAt(snake.Count - 1);
            }

            this.Invalidate();
        }

        private void OnKeyDown(object sender, KeyEventArgs e)
        {
            if (e.KeyCode == Keys.Up && directionY != 1) { directionX = 0; directionY = -1; }
            else if (e.KeyCode == Keys.Down && directionY != -1) { directionX = 0; directionY = 1; }
            else if (e.KeyCode == Keys.Left && directionX != 1) { directionX = -1; directionY = 0; }
            else if (e.KeyCode == Keys.Right && directionX != -1) { directionX = 1; directionY = 0; }
        }

        protected override void OnPaint(PaintEventArgs e)
        {
            base.OnPaint(e);
            Graphics g = e.Graphics;

            Pen gridPen = new Pen(Color.LightGray, 1);
            for (int i = 0; i <= gridSize; i++)
            {
                g.DrawLine(gridPen, i * cellSize, 0, i * cellSize, gridSize * cellSize);
                g.DrawLine(gridPen, 0, i * cellSize, gridSize * cellSize, i * cellSize);
            }

            Pen wallPen = new Pen(Color.DarkRed, 2);
            g.DrawRectangle(wallPen, 1, 1, (gridSize * cellSize) - 2, (gridSize * cellSize) - 2);

            g.FillEllipse(Brushes.Red, food.X * cellSize, food.Y * cellSize, cellSize, cellSize);

            for (int i = 0; i < snake.Count; i++)
            {
                Brush b = i == 0 ? Brushes.DarkGreen : Brushes.Green;
                g.FillRectangle(b, snake[i].X * cellSize, snake[i].Y * cellSize, cellSize, cellSize);
            }

            g.DrawString($"Счет: {score}", new Font("Arial", 12, FontStyle.Bold), Brushes.Black, new Point(5, 5));
        }

        private void GameOver(string reason)
        {
            gameTimer.Stop();
            MessageBox.Show($"{reason}\n\nВаш счет: {score}", "Сбой системы");
            InitGame();
            gameTimer.Start();
        }
    }

    static class Program
    {
        static void Main()
        {
            Application.EnableVisualStyles();
            Application.SetCompatibleTextRenderingDefault(false);
            Application.Run(new GameForm());
        }
    }
}
